version: '3.9'

services:
  logocreator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logocreator
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Add your Together AI API key here or use .env file
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
    restart: unless-stopped
    # Uncomment if you want to use a .env file
    # env_file:
    #   - .env
